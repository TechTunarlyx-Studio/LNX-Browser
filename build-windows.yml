name: Build LNX Browser Windows Installer

# Runs a real Windows machine in the cloud, installs Node.js there,
# builds the app, and packages a real NSIS setup .exe with electron-builder.
# You don't need Node.js (or anything else) installed on your own PC —
# just a GitHub account and this repo.

on:
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the Windows installer (.exe)
        run: npm run dist:win

      - name: Upload the installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNX-Browser-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
